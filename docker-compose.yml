services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "3001:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Доступ к мосту подписки Claude на хосте (tools/llm-bridge):
    # host.docker.internal резолвится в шлюз сети этого контейнера.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - art-data:/data/art
      - db-data:/data/db
    environment:
      - ART_STORAGE_PATH=/data/art
      - ANALYTICS_DB_PATH=/data/db/analytics.db

volumes:
  art-data:
  db-data:
