<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Иконка сайта: стрелочный прибор со стрелкой в красной зоне.
    Название буквальное («задрото-метр»), поэтому и знак буквальный — прибор,
    который что-то намерил и показывает максимум.

    Рисунок рассчитан на 16 пикселей во вкладке браузера: только толстая дуга
    и стрелка, никаких мелких деталей — на такой величине они сливаются в кашу.
  -->
  <defs>
    <linearGradient id="scale" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0f0f1a"/>

  <!-- Шкала: полукруг от «нормально» к «всё плохо». -->
  <path d="M 6.5 22 A 9.5 9.5 0 0 1 25.5 22"
        fill="none" stroke="url(#scale)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Стрелка упёрта в конец шкалы. -->
  <path d="M 16 22 L 23.2 16.4"
        fill="none" stroke="#ec4899" stroke-width="2.6" stroke-linecap="round"/>

  <circle cx="16" cy="22" r="2.4" fill="#ec4899"/>
</svg>
